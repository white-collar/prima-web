[package]
name = "prima"
version = "1.0.0"
description = "PRIMA — spheroidal geodesy on the Krasovsky 1940 ellipsoid"
authors = ["Eugene Shmorgun"]
repository = "https://github.com/white-collar/prima-web"
edition = "2024"
rust-version = "1.90"

[lib]
name = "prima_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
# Smaller binary: the app is a thin window around the web files.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
